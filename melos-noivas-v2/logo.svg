<svg viewBox="0 0 240 80" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .melos-main { font-family: 'Georgia', serif; font-size: 48px; font-weight: bold; fill: #8B2E2E; letter-spacing: 2px; }
      .melos-sub { font-family: 'Georgia', serif; font-size: 16px; fill: #333; letter-spacing: 3px; font-weight: 600; }
    </style>
  </defs>

  <!-- Decorative swirl left -->
