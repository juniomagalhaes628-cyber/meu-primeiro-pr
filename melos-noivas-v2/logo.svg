    <path d="M 28 60 Q 24 45 28 30 Q 32 15 44 10 Q 48 8 51 18 Q 53 28 51 42 Q 49 55 44 60"
          stroke="#8B2E2E" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Main text -->
  <text x="70" y="55" class="melos-main">Melos</text>
  <text x="70" y="75" class="melos-sub">NOIVAS</text>

  <!-- Accent line -->
