    <style>
      .logo-text { font-family: Georgia, serif; font-size: 32px; font-weight: bold; fill: #8B2E2E; }
      .logo-sub { font-family: Georgia, serif; font-size: 14px; fill: #333; letter-spacing: 1px; }
